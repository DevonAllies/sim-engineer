<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bono the Engineer</title>
<style>
:root{--ink:#eef0f4;--muted:#9aa3b2;--line:rgba(255,255,255,.09);--panel:rgba(14,16,21,.82);--accent:#ff6a4d;
  --us2:#4a9cf0;--us1:#8cc4f7;--ok:#5fd38d;--os1:#ffc06b;--os2:#ff8a3c;--bad:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;height:100%}
body{font:12px/1.25 system-ui,"Segoe UI",sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;user-select:none}
.brand{display:flex;align-items:center;gap:6px;min-width:0}
.brand img{height:16px;max-width:90px;object-fit:contain;display:none}
.brand .bt{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--ink);background:rgba(255,255,255,.1);border-radius:4px;padding:1px 6px;white-space:nowrap}
.rhgrid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:1px 6px;background:rgba(255,255,255,.05);border-radius:6px;padding:3px 6px;font-size:11px;align-items:baseline}
.rhgrid .k{font-size:9px}
.rhgrid b{font-size:12px}
.rhgrid .d{font-size:9.5px;color:var(--muted);font-weight:400}
.coach{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.05);border-radius:6px;padding:3px 6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.log{display:flex;flex-direction:column;gap:1px;font-size:10px;color:var(--muted);min-height:36px}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log div:first-child{color:var(--ink)}
#root{position:relative;width:100%;height:100%;padding:9px 11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;transition:opacity .25s;display:flex;flex-direction:column;gap:6px}
body.hidden #root{opacity:0}
body.edit #root{outline:2px dashed var(--accent);outline-offset:-2px;-webkit-app-region:drag;cursor:move}
#editbar{display:none;position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;color:#fff;background:var(--accent);border-radius:0 0 10px 10px;padding:2px}
body.edit #editbar{display:block}
.k{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top b{font-size:11px;letter-spacing:.1em;color:var(--accent)}
.view{display:none;flex-direction:column;gap:6px;flex:1}
body.drive #drive, body.report #report{display:flex}
/* balance */
.big{font-size:22px;font-weight:800;letter-spacing:.02em;text-align:center;line-height:1.1}
.scale{display:flex;gap:3px;height:9px}
.scale i{flex:1;border-radius:3px;background:rgba(255,255,255,.08);transition:background .15s}
.scale i.on{box-shadow:0 0 0 1px rgba(255,255,255,.7) inset}
.chips{display:flex;gap:5px}
.chip{flex:1;background:rgba(255,255,255,.05);border-radius:6px;padding:3px 6px;min-width:0}
.chip b{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.05);border-radius:6px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:auto}
.stat{background:rgba(255,255,255,.05);border-radius:6px;padding:3px 6px}
.stat b{display:block;font-size:12px}
.tgt{font-size:9.5px;color:var(--muted);font-weight:400}
/* colours for the 5-step scale */
.c-2{color:var(--os2)}.c-1{color:var(--os1)}.c0{color:var(--ok)}.c1{color:var(--us1)}.c2{color:var(--us2)}
.ok{color:var(--ok)}.warn{color:var(--os2)}.bad{color:var(--bad)}
/* report */
.tyres{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:1}
.ty{background:rgba(255,255,255,.05);border-radius:6px;padding:4px 6px;display:flex;flex-direction:column;gap:3px}
.ty .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;color:var(--muted)}
.ty .hd b{color:var(--ink);font-size:12px}
.temps{display:flex;gap:2px}
.temps i{flex:1;height:16px;line-height:16px;border-radius:3px;font-style:normal;font-size:10.5px;font-weight:700;color:#111;text-align:center}
.verdict{font-size:10px}
</style>
</head>
<body class="hidden drive">
<div id="root">
  <div class="top"><span class="brand"><img id="logo" alt=""><span class="bt" id="brand"></span><b id="title">BONO</b></span><span class="k" id="info">waiting for iRacing</span></div>

  <div class="view" id="drive">
    <div class="big" id="big">–</div>
    <div class="scale" id="scale"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="coach" id="coach"><span class="k">Vs your best</span> <span class="muted">–</span></div>
    <div class="coach" id="loss"><span class="k">Vs fastest</span> <span class="tgt">starts after your first clean lap</span></div>
    <div class="stats">
      <div class="stat"><span class="k">Brake bias</span><b id="ibias">–</b></div>
      <div class="stat"><span class="k">TC</span><b id="itc">–</b></div>
      <div class="stat"><span class="k">ABS</span><b id="iabs">–</b></div>
    </div>
    <div class="line" id="incar">In-car suggestions appear after a few corners</div>
  </div>

  <div class="view" id="report">
    <div class="tyres" id="tyres"></div>
    <div class="line" id="rbal">–</div>
  </div>

  <div id="editbar">Bono the Engineer · drag to move · drag the edge to resize</div>
</div>
<script>
"use strict";
const BASE_W = 340;
const Q = new URLSearchParams(location.search), UNITS = Q.get("units")==="psi" ? "psi" : "kPa", NUMBERS = Q.get("numbers")==="1";
// wheelbase + ride-height targets from each car's iRacing manual (picked from the telemetry's CarPath)
// help: +1 when a higher number means more TC/ABS help, -1 when lower means more (Mercedes); tc/abs: dry ranges from the manuals
const CARS = {
  acuransxevo22gt3:{wb:2.642, f:40, r:55, help:1, tc:[2,7], abs:[2,7]},
  mercedesamgevogt3:{wb:2.630, f:40, r:67.5, help:-1, tc:[1,11], abs:[7,11]},
  lamborghinievogt3:{wb:2.645, f:40, r:62, help:1, tc:[1,10], abs:[1,6]},
  porsche992rgt3:{wb:2.507, help:1}, dallarap217:{wb:3.010, f:5, r:50, help:1},
  porsche9922cup:{wb:2.459, help:1},
};
const $ = id => document.getElementById(id);
const fmt = (v,d=1) => Number.isFinite(v) ? v.toFixed(d) : "–";
const median = a => { if (!a.length) return NaN; const s=Float64Array.from(a).sort(); const m=s.length>>1; return s.length%2? s[m] : (s[m-1]+s[m])/2; };
// text size and font come from the app (Overlays panel); the window itself can be any size
let TEXT = 1;
function fit(){ document.body.style.zoom = TEXT; }
fit();
if (window.se && window.se.onStyle) window.se.onStyle(s => { TEXT = s.text || 1; document.body.style.fontFamily = `"${s.font||"Segoe UI"}", system-ui, sans-serif`; fit(); });

let edit = false;
if (window.se) window.se.onEditMode(on => { edit = on; document.body.classList.toggle("edit", on); });

// ---------- balance in words: 5 steps ----------
// understeer angle (deg, front wheel) relative to the car's own gentle-cornering baseline
const STEPS = [ {max:-1.0, w:"Oversteer", c:-2}, {max:-0.4, w:"Slight oversteer", c:-1}, {max:0.7, w:"Neutral", c:0}, {max:1.6, w:"Slight understeer", c:1}, {max:Infinity, w:"Understeer", c:2} ];
const step = u => STEPS.find(s=>u<=s.max);
// trend over recent corners: each corner judged on its own, so one bad corner isn't averaged away by a lap of neutral driving
function trend(el, vals){
  const v=vals.filter(Number.isFinite); if (v.length<3){ el.textContent="–"; el.className=""; return; }
  const m=v.reduce((a,b)=>a+b,0)/v.length, s=step(m);
  const pushN=v.filter(x=>x>0.7).length, looseN=v.filter(x=>x<-0.4).length;
  let txt=s.w; if (s.c>0) txt+=` ${pushN}/${v.length}`; else if (s.c<0) txt+=` ${looseN}/${v.length}`;
  else if (pushN||looseN) txt += pushN>=looseN ? ` · ${pushN} push` : ` · ${looseN} loose`;
  el.textContent = txt + (NUMBERS? ` ${fmt(m)}°` : ""); el.className = "c"+s.c;
}
function word(el, a, minN=20){
  if (a.length<minN){ el.textContent="–"; el.className=""; return; }
  const m=median(a), s=step(m); el.textContent = s.w + (NUMBERS? ` ${fmt(m)}°` : ""); el.className = "c"+s.c;
}

// ---------- iRacing data ----------
const WANT = ["PlayerTrackSurface","SessionTime","Speed","SteeringWheelAngle","YawRate","LatAccel","Brake","Throttle","Lap","LapDist","LapDistPct","OnPitRoad","IsOnTrack","PlayerCarInPitStall","BrakeABSactive","VertAccel","LFspeed","RFspeed","LRspeed","RRspeed",
  "LFrideHeight","RFrideHeight","LRrideHeight","RRrideHeight","CFSRrideHeight","dcBrakeBias","dcTractionControl","dcABS",
  "LFpressure","RFpressure","LRpressure","RRpressure",
  "LFtempL","LFtempM","LFtempR","RFtempL","RFtempM","RFtempR","LRtempL","LRtempM","LRtempR","RRtempL","RRtempM","RRtempR"];
const TYPES = {0:"getUint8",1:"getUint8",2:"getInt32",3:"getUint32",4:"getFloat32",5:"getFloat64"};
const cstr = b => { let s=""; for (const x of b){ if(!x) break; s+=String.fromCharCode(x);} return s; };
const CORN = {LF:"LeftFront",RF:"RightFront",LR:"LeftRear",RR:"RightRear"};
function parseMeta(buf){
  const dv=new DataView(buf), i32=o=>dv.getInt32(o,true);
  const siLen=i32(16), siOff=i32(20), numVars=i32(24), varOff=i32(28), bufLen=i32(36), vars={};
  for (let i=0;i<numVars;i++){ const o=varOff+i*144; vars[cstr(new Uint8Array(buf,o+16,32))]={type:i32(o),off:i32(o+4),count:i32(o+8)}; }
  const yaml=cstr(new Uint8Array(buf,siOff,siLen));
  const idx=(yaml.match(/DriverCarIdx:\s*(\d+)/)||[])[1];
  let car=""; if (idx!==undefined){ const m=yaml.match(new RegExp("\\n\\s*- CarIdx:\\s*"+idx+"\\s*\\n[\\s\\S]*?CarPath:\\s*(\\S+)")); if (m) car=m[1]; }
  // garage tyre reading (CarSetup › TiresAero › corner › LastTemps / LastHotPressure)
  const garage={}, setup=yaml.slice(yaml.indexOf("CarSetup:"));
  for (const [c,name] of Object.entries(CORN)){
    const m=setup.match(new RegExp(name+":[\\s\\S]*?LastHotPressure:\\s*([\\d.]+)[\\s\\S]*?LastTemps(OMI|IMO):\\s*([^\\n]+)"));
    if (!m) continue; const v=m[3].split(",").map(parseFloat); if (v.length!==3 || v.some(isNaN)) continue;
    const omi=m[2]==="OMI"; garage[c]={outer:omi?v[0]:v[2], mid:v[1], inner:omi?v[2]:v[0], hot:parseFloat(m[1])};
    const tr=setup.match(new RegExp(name+":[\\s\\S]*?TreadRemaining:\\s*([^\\n]+)"));
    if (tr){ const w=tr[1].split(",").map(parseFloat).filter(x=>!isNaN(x)); if (w.length===3) garage[c].tread=Math.min(...w); }
  }
  // static (parked) ride heights from the garage setup
  const rh = n => { const m=setup.match(new RegExp("Chassis:[\\s\\S]*?"+n+":[\\s\\S]*?RideHeight:\\s*([\\d.]+)")); return m? parseFloat(m[1]) : NaN; };
  const stat = { f:(rh("LeftFront")+rh("RightFront"))/2, r:(rh("LeftRear")+rh("RightRear"))/2 };
  let carName=""; if (idx!==undefined){ const m=yaml.match(new RegExp("\\n\\s*- CarIdx:\\s*"+idx+"\\s*\\n[\\s\\S]*?CarScreenName:\\s*([^\\n]+)")); if (m) carName=m[1].trim(); }
  const names={}; for (const m of yaml.matchAll(/- CarIdx:\s*(\d+)\s*\n\s*UserName:\s*([^\n]+)/g)) names[+m[1]]=m[2].trim();
  const trackL = (parseFloat((yaml.match(/TrackLength:\s*([\d.]+)/)||[])[1])||0)*1000;
  const trackId = ((yaml.match(/TrackID:\s*(\d+)/)||[])[1]) || ((yaml.match(/TrackName:\s*([^\n]+)/)||[])[1]||"").trim();
  return {trackId, trackL, vars, bufLen, car, carName, garage, garageSig: JSON.stringify(garage), stat, me: idx!==undefined? +idx : -1, names};
}
function decode(dv,p,vars){ const s={}; for (const k of WANT){ const v=vars[k]; if (v && v.count===1) s[k]=dv[TYPES[v.type]](p+v.off,true); } return s; }

// ---------- rolling analysis ----------
let zone=null;
const ST = { vert:[], zones:[], spin:[], exitSlides:[], outLap:true, corners:[], gen:null, si:null, next:-120, meta:null, last:null, recent:[], lap:null, cur:null, prev:null, stint:null, ratios:[], sgn:[0,0], K:15, osRun:0, connected:false, ref:null, best:Infinity, lapT0:null, log:[], coach:null };
function newLap(){ return {trace:[], entry:[],mid:[],exit:[],slow:[],fast:[],corners:[],rhF:[],rhR:[],rhcF:[],rhcR:[],spl:Infinity,slides:0,tyre:{n:0},valid:true}; }
function newStint(){ return {laps:0, entry:[],mid:[],exit:[], garageSig: ST.meta ? ST.meta.garageSig : "", lastLapTyres:null}; }
ST.cur = newLap();
let corner=null, quiet=0;
function addLog(msg){ if (ST.log[0] && ST.log[0].msg===msg) return; ST.log.unshift({msg, t:Date.now()}); ST.log.length=Math.min(ST.log.length,4); }
const sg = x => (x>=0?"+":"−")+Math.abs(Math.round(x));
const atKm = m => Number.isFinite(m) ? (m/1000).toFixed(2)+" km" : "";
function closeCorner(){
  if (corner && corner.us.length>20){
    const endP = ST.last ? ST.last.LapDistPct : NaN;
    const rec = {a:corner.a, m:corner.apexP, b:endP, at:corner.at, brkAt:corner.brkAt, apexAt:corner.apexAt, powAt:corner.powAt, endAt: ST.last ? ST.last.LapDist : NaN, exitSlide:corner.exitSlide, us:median(corner.us), v:median(corner.v), entry:corner.entry, min:corner.min, exit:corner.lastV,
                 usIn: corner.usIn.length>5 ? median(corner.usIn) : NaN, slide:corner.slide,
                 ph:{entry:corner.ph.entry.length>8?median(corner.ph.entry):NaN, mid:corner.ph.mid.length>8?median(corner.ph.mid):NaN, exit:corner.ph.exit.length>8?median(corner.ph.exit):NaN}};
    ST.cur.corners.push(rec); judge(rec);
    ST.corners.push(rec); if (ST.corners.length>24) ST.corners.shift();
  }
  corner=null;
}
// corner entry coaching: compare this corner with the same corner on your best lap
// ---------- time lost per corner to the fastest car in your class (live: every car's position, 20x a second) ----------
// sections come from your best lap: a = braking point, m = slowest point (apex), b = corner exit
function buildSecs(ref){
  const secs = ref.filter(c=>c.a<c.m && c.m<c.b && c.b-c.a<0.25).map((c,i)=>({n:i+1, a:c.a, m:c.m, b:c.b}));
  if (secs.length<2) return;
  ST.secs = secs; ST.bnd = [];
  secs.forEach((s,k)=>{ ST.bnd.push({p:s.a,k,w:0},{p:s.m,k,w:1},{p:s.b,k,w:2}); });
  ST.bnd.sort((x,y)=>x.p-y.p); ST.det = {}; ST.bestOther = {};
}
function readArr(dv,p,v){ const fn=TYPES[v.type], sz=v.type===5?8:(v.type<=1?1:4), out=new Array(v.count); for (let i=0;i<v.count;i++) out[i]=dv[fn](p+v.off+i*sz,true); return out; }
function timeCars(dv, p, t){
  const V=ST.meta.vars, vp=V.CarIdxLapDistPct; if (!vp || vp.count<2) return;
  const pct=readArr(dv,p,vp), pit=V.CarIdxOnPitRoad?readArr(dv,p,V.CarIdxOnPitRoad):null, surf=V.CarIdxTrackSurface?readArr(dv,p,V.CarIdxTrackSurface):null, cls=V.CarIdxClass?readArr(dv,p,V.CarIdxClass):null;
  const me=ST.meta.me, B=ST.bnd;
  for (let car=0; car<pct.length; car++){
    if (cls && me>=0 && cls[car]!==cls[me]) continue;
    const D = ST.det[car] || (ST.det[car]={prev:NaN, prevT:NaN, cur:{}, buf:[]});
    const x=pct[car];
    if (!(x>=0) || (pit&&pit[car]) || (surf&&surf[car]!==3)){ D.prev=NaN; D.cur={}; D.buf=[]; continue; }
    D.buf.push([t,x]); if (D.buf.length>700) D.buf.shift();
    if (Number.isFinite(D.prev)){
      let d=x-D.prev; if (d<-0.5) d+=1;
      if (d<0 || d>0.05){ D.cur={}; }
      else for (const h of B){
        let q=h.p-D.prev; if (q<=0) q+=1; if (q>d) continue;
        const tc=D.prevT+(t-D.prevT)*(q/d), c=D.cur[h.k]||(D.cur[h.k]={});
        if (h.w===0){ D.cur[h.k]={a:tc}; }
        else if (h.w===1 && c.a){ c.m=tc; }
        else if (h.w===2 && c.a && c.m && tc-c.a<60){
          const r={entry:c.m-c.a, exit:tc-c.m, total:tc-c.a};
          const prof = () => passProfile(D.buf.filter(s=>s[0]>=c.a-3), ST.meta.trackL);
          if (car===me) reportLoss(h.k, r, prof());
          else { const b=ST.bestOther[h.k]; if (!b || r.total<b.total) ST.bestOther[h.k]={...r, car, prof:prof()}; }
          delete D.cur[h.k];
        }
      }
    }
    D.prev=x; D.prevT=t;
  }
}
function reportLoss(k, mine, prof){
  const b=ST.bestOther[k]; if (!b) { ST.loss={name:`T${k+1}`, none:true, t:Date.now()}; return; }
  const entry=mine.entry-b.entry, exit=mine.exit-b.exit;
  ST.loss={name:`T${k+1}`, loss:mine.total-b.total, entry, exit, who:(ST.meta.names||{})[b.car]||"", advice: adviceFor(prof, b.prof, ST.meta.trackL, entry, exit), t:Date.now()};
}
// speed from position over time (same method for you and the others), then braking point / apex speed / acceleration point
function passProfile(buf, L){
  if (!L) return null; const pts=[]; for (let i=1;i<buf.length;i++){ let d=buf[i][1]-buf[i-1][1]; if (d<-0.5) d+=1; const dt=buf[i][0]-buf[i-1][0]; if (dt<=0 || d<0 || d>0.05) continue; pts.push({p:buf[i][1], v:d*L/dt*3.6}); }
  if (pts.length<10) return null;
  const v=pts.map((x,i)=>{ let s=0,n=0; for (let k=i-2;k<=i+2;k++) if (pts[k]){ s+=pts[k].v; n++; } return s/n; });
  let iMin=0; for (let i=0;i<v.length;i++) if (v[i]<v[iMin]) iMin=i;
  let iMax=0; for (let i=0;i<=iMin;i++) if (v[i]>v[iMax]) iMax=i;
  let iBrk=iMax; for (let i=iMax;i<iMin;i++) if (v[i]<v[iMax]-4){ iBrk=i; break; }
  let iAcc=v.length-1; for (let i=iMin;i<v.length;i++) if (v[i]>v[iMin]+3){ iAcc=i; break; }
  return {brk:pts[iBrk].p, vmin:v[iMin], acc:pts[iAcc].p};
}
function adviceFor(mine, theirs, L, lossIn, lossOut){
  const out=[], wrap=d=>d>0.5?d-1:d<-0.5?d+1:d, M=8; if (!mine || !theirs || !L) return out;
  if (lossIn>0.03){ const dm=wrap(mine.brk-theirs.brk)*L;
    if (dm<-M) out.push(`brake ${Math.round(-dm)} m later`); else if (dm>M) out.push(`brake ${Math.round(dm)} m earlier`); else if (mine.vmin<theirs.vmin-2) out.push(`+${Math.round(theirs.vmin-mine.vmin)} km/h at the apex`); else out.push("carry more speed in"); }
  if (lossOut>0.03){ const dm=wrap(mine.acc-theirs.acc)*L;
    if (dm>M) out.push(`power ${Math.round(dm)} m earlier`); else if (dm<-M) out.push(`wait ${Math.round(-dm)} m longer before full throttle`); else out.push("smoother on the power"); }
  return out;
}
// time at a lap distance (m) from a lap trace (time since the line, every 5 m)
function tAt(tr, m){ if (!tr || !Number.isFinite(m)) return NaN; for (let i=Math.floor(m/5); i>=0 && i>Math.floor(m/5)-12; i--) if (tr[i]!==undefined) return tr[i]; return NaN; }
const seg = (tr,a,b) => tAt(tr,b)-tAt(tr,a);
// your own pedals vs your best lap: where the brake went on, where full throttle came back, and what it cost
function pedalAdvice(rec, ref){
  const out={tips:[], lossIn:NaN, lossOut:NaN, loss:NaN};
  if (!ST.refTrace) return out;
  const fin=Number.isFinite, a=Math.min(fin(rec.brkAt)?rec.brkAt:rec.at, fin(ref.brkAt)?ref.brkAt:ref.at)-15, m=ref.apexAt, b=rec.endAt;
  if (!(fin(a) && fin(m) && fin(b) && a<m && m<b && b-a<1500)) return out;
  out.lossIn = seg(ST.cur.trace,a,m)-seg(ST.refTrace,a,m); out.lossOut = seg(ST.cur.trace,m,b)-seg(ST.refTrace,m,b); out.loss=out.lossIn+out.lossOut;
  if (!fin(out.loss)) return out;
  const M=5, R=Math.round, dB=rec.brkAt-ref.brkAt, dP=rec.powAt-ref.powAt, dMin=rec.min-ref.min;   // dB>0 = braked later, dP>0 = full throttle later
  if (out.loss<=0.03){ out.lossIn=Math.min(out.lossIn,0); out.lossOut=Math.min(out.lossOut,0); }   // the corner as a whole didn't cost time: no fix needed
  if (out.lossIn>0.03){
    if (dB<-M) out.tips.push(`brake ${R(-dB)} m later`);
    else if (dB>M) out.tips.push(`brake ${R(dB)} m earlier`);               // braked later and still lost time: overshot

  // brake bias
  let b = fmt(s.dcBrakeBias,1);
  if (ready && fwd.length>=2 && fwd.length>rwd.length){ b += ` <span class="warn">→ ${fmt(s.dcBrakeBias+0.5,1)} ▲</span>`; tips.push(`Bias forward: rear loose on the brakes at ${fwd.map(km).slice(0,3).join(", ")}`); }
  else if (ready && rwd.length>=3 && rwd.length>fwd.length){ b += ` <span class="c1">→ ${fmt(s.dcBrakeBias-0.5,1)} ▼</span>`; tips.push(`Bias back: fronts doing all the braking (${rwd.length} of ${Z.length} zones)`); }
  $("ibias").innerHTML = b;
  // TC (respect the car's numbering and dry range)
  const tcNow=s.dcTractionControl, more=tcNow+help, less=tcNow-help, inR=(v,r)=>!r || (v>=r[0] && v<=r[1]);
  let tc = fmt(tcNow,0);
  if (!ST.outLap && (spin>0.12 || ST.exitSlides.length>=3) && inR(more,car.tc)){ tc += ` <span class="warn">→ ${more}</span>`; tips.push(`More TC: ${ST.exitSlides.length>=3?ST.exitSlides.length+" slides on exit":"wheelspin on exit"} in the last 2 min`); }
  else if (!ST.outLap && ST.spin.length>600 && spin<0.02 && !ST.exitSlides.length && inR(less,car.tc)){ tc += ` <span class="c1">→ ${less}</span>`; tips.push("Less TC: hardly any wheelspin, you can put the power down sooner"); }
  $("itc").innerHTML = tc;
  // ABS
  const absNow=s.dcABS; let ab = fmt(absNow,0);
  if (ready && lockF>0.12 && inR(absNow+help,car.abs)){ ab += ` <span class="warn">→ ${absNow+help}</span>`; tips.push("More ABS: front tyres still locking"); }
  else if (ready && absUse>0.5 && lockF<0.03 && inR(absNow-help,car.abs)){ ab += ` <span class="c1">→ ${absNow-help}</span>`; tips.push("Less ABS: it's working hard and nothing locks, shorter stops possible"); }
  $("iabs").innerHTML = ab;
  $("incar").innerHTML = tips.length ? tips.join(" · ") : (ready ? `<span class="ok">Bias, TC and ABS look right</span>` : (ST.outLap ? "Out lap: watching from the first flying lap" : "In-car suggestions appear after a few braking zones"));
  // radio: say a new in-car change once (not again until the advice changes)
  const arrow = h => (h.match(/→ ([\d.]+)/)||[])[1], calls=[];
  if (arrow(b)) calls.push(`brake bias to ${arrow(b)}`); if (arrow(tc)) calls.push(`T C to ${arrow(tc)}`); if (arrow(ab)) calls.push(`A B S to ${arrow(ab)}`);
  const key = calls.join("|");
  if (key && key!==ST.saidInCar){ const why=(tips[0]||"").split(":").slice(1).join(":").replace(/ at [\d., km]+$/,"").trim(); say(`Try ${calls.join(", and ")}${why?". "+why:""}.`, 2); }
  ST.saidInCar = key;
}
// ---------- team radio ----------
const say = (text, pri=1) => { if (window.se && window.se.radioSay) window.se.radioSay("bono", text, pri); };
const PH = {entry:"on entry", mid:"mid-corner", exit:"on exit"};
function balanceCall(){   // after each clean lap: say the balance only when it changes
  if ((ST.lapsClean||0)<2) return; const L=ST.prev; if (!L) return;
  let worst=null; for (const p of ["entry","mid","exit"]){ const a=L[p]; if (a.length<20) continue; const s=step(median(a)); if (s.c!==0 && (!worst || Math.abs(s.c)>Math.abs(worst.s.c))) worst={p, s}; }
  const txt = !worst ? "Balance is good, car's neutral." : worst.s.c>0 ? `Car's ${worst.s.c>1?"":"slightly "}understeering ${PH[worst.p]}.` : `Car's ${worst.s.c<-1?"":"a bit "}loose ${PH[worst.p]}.`;
  if (txt!==ST.saidBal){ if (ST.saidBal || worst) say(txt, 1); ST.saidBal=txt; }
}
function reportCall(){   // in the pits after a stint: a short tyre summary
  const R=reportTyres(); if (!R) return; const ax={Front:["LF","RF"], Rear:["LR","RR"]}, parts=[];
  for (const [nm,cs] of Object.entries(ax)){ const v=cs.map(c=>verdict(R.t[c], R.src!=="garage reading").replace(/<[^>]+>/g,"")); const issues=[...new Set(v.flatMap(x=>x.split(" · ")).filter(x=>!/OK/.test(x)))];
    parts.push(`${nm}s: ${issues.length?issues.join(", "):"camber and pressures look good"}`); }
  const W=tyreWin(R), win=[["Fronts",W.fv],["Rears",W.rv]].filter(([,v])=>Number.isFinite(v) && (v<W.lo-2 || v>W.hi+2)).map(([n,v])=>`${n} ${v<W.lo?"below":"above"} the working window by about ${Math.round(v<W.lo?W.lo-v:v-W.hi)} degrees`);
  say(`Stint report. ${[...win, ...parts].join(". ")}.`, 2);
}

// ---------- car badge: your own logo image if you put one in the logos folder, else the brand name ----------
const BRANDS = [[/^acura/,"Acura"],[/^mercedes/,"Mercedes-AMG"],[/^lamborghini/,"Lamborghini"],[/^porsche/,"Porsche"],[/^dallara/,"Dallara"],
  [/^ferrari/,"Ferrari"],[/^bmw/,"BMW"],[/^audi/,"Audi"],[/^mclaren/,"McLaren"],[/^ford/,"Ford"],[/^amvantage|^astonmartin/,"Aston Martin"],
  [/^chevy|^corvette/,"Chevrolet"],[/^cadillac/,"Cadillac"],[/^ligier/,"Ligier"],[/^lotus/,"Lotus"],[/^toyota/,"Toyota"],[/^honda/,"Honda"],[/^hyundai/,"Hyundai"]];
let brandFor = "";
function setBrand(){
  const car = ST.meta?.car || ""; if (car===brandFor) return; brandFor = car;
  const b = (BRANDS.find(([re])=>re.test(car))||[,""])[1], img=$("logo");
  $("brand").textContent = b ? b.toUpperCase() : ""; $("brand").title = ST.meta?.carName || car;
  const tries = [car, b.toLowerCase().replace(/[^a-z]/g,"")].filter(Boolean).map(n=>`/logos/${n}.png`); let i=0;
  img.onload = ()=>{ img.style.display="block"; $("brand").style.display="none"; };
  img.onerror = ()=>{ if (++i<tries.length) img.src=tries[i]; else { img.style.display="none"; $("brand").style.display=""; } };
  if (tries.length) img.src = tries[0];
}

// ---------- driving view ----------
function drawDrive(){
  const s=ST.last, car=CARS[ST.meta?.car]||{};
  $("title").textContent = "BONO";
  const calibrated = !ST.outLap && (ST.ratios.length>150 || ST.Kstored);   // steering ratio measured now, or remembered from before   // out lap (cold tyres) + enough gentle corners for the steering baseline
  const u = calibrated ? median(ST.recent.filter(Number.isFinite)) : NaN, st = Number.isFinite(u) ? step(u) : null;
  $("big").textContent = st ? st.w + (NUMBERS? ` ${fmt(u)}°` : "") : calibrated ? "Straight" : ST.outLap ? "Out lap – calibrating" : "Calibrating…";
  $("big").className = "big " + (st ? "c"+st.c : "");
  const COLS = {"-2":"var(--os2)","-1":"var(--os1)","0":"var(--ok)","1":"var(--us1)","2":"var(--us2)"};
  [...$("scale").children].forEach((el,i)=>{ const c=i-2, on = st && st.c===c; el.style.background = on ? COLS[c] : "rgba(255,255,255,.08)"; el.className = on ? "on" : ""; });
  const L = (ST.prev && ST.prev.mid.length>20) ? ST.prev : ST.cur;
  // (entry / mid / exit and slow / fast corner balance live in the app's Balance window)
  // time lost to the fastest car in your class through the last corner (held 10 s)
  const sgn2 = x => (x>=0?"+":"−")+Math.abs(x).toFixed(2), escH = x => String(x).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const L2 = ST.loss && Date.now()-ST.loss.t < 15000 ? ST.loss : null;
  $("loss").innerHTML = !ST.secs ? `<span class="k">Vs fastest</span> <span class="tgt">starts after your first clean lap</span>`
    : L2 ? (L2.none ? `<span class="k">${L2.name}</span> <span class="tgt">no other car timed here yet</span>`
       : `<span class="k">${L2.name}</span> <span class="${L2.loss>0.05?"warn":L2.loss<-0.02?"ok":""}">${sgn2(L2.loss)} s</span> <span class="tgt">${L2.advice&&L2.advice.length ? `<b style="color:var(--ink)">${escH(L2.advice.join(", "))}</b>` : `to fastest · entry ${sgn2(L2.entry)} · exit ${sgn2(L2.exit)}`}${L2.who?" · "+escH(L2.who):""}</span>`)
    : `<span class="k">Vs fastest</span> <span class="tgt">${Object.keys(ST.bestOther||{}).length} of ${ST.secs.length} corners timed on other cars</span>`;
  // corner entry coaching: last judged corner, held for 8 s
  const co = ST.coach && Date.now()-ST.coach.t < 15000 ? ST.coach : null;
  $("coach").innerHTML = co ? `<span class="k">${co.name}</span> <span class="${co.c}">${co.w}</span>${co.d?` <span class="tgt">${co.d}</span>`:""}`
    : `<span class="k">Vs your best</span> <span class="tgt">${ST.ref ? "brake and throttle points per corner" : "after your first clean lap"}</span>`;
  if (!s) return;
  $("info").textContent = `lap ${s.Lap}${ST.cur.slides?` · ${ST.cur.slides} slide${ST.cur.slides>1?"s":""}`:""}${L===ST.prev?" · last lap":""}`;
  const sp = Number.isFinite(ST.cur.spl) ? ST.cur.spl : (ST.prev? ST.prev.spl : NaN);
  drawInCar(s, car);
}

function draw(){
  const s=ST.last;
  const inCar   = s && s.IsOnTrack;                                   // sitting in the car (pit stall, pit lane or track)
  const driving = inCar && !s.OnPitRoad;
  const stopped = s && ((s.OnPitRoad && s.Speed<2) || s.PlayerCarInPitStall || !s.IsOnTrack);
  const report  = ST.connected && stopped && ST.stint && ST.stint.laps>0;
  document.body.classList.toggle("report", !!report && !edit);
  document.body.classList.toggle("drive", !report || edit);
  // visible whenever iRacing is connected: in the car, in the pits and in the garage (the stint report once you've driven)
  document.body.classList.toggle("hidden", !(edit || ST.connected));
  if (report && !edit) drawReport(); else drawDrive();
  if (!report && inCar && s.OnPitRoad && s.Speed<2){ $("big").textContent = "In pits"; $("big").className = "big"; }
  if (!report && s && !inCar){ $("big").textContent = "In the garage"; $("big").className = "big"; }
  // a new stint starts when you drive out again
  if (driving && ST.stint && ST.stint.closed){ ST.stint = newStint(); ST.checking={what:"setup", t:Date.now(), lap0:ST.lapsClean||0}; ST.zones=[]; ST.spin=[]; }   // new stint: the lap count carries on; one clean lap on the (maybe changed) setup first
  if (report){ if (!ST.stint.closed) setTimeout(reportCall, 4000); ST.stint.closed = true; }   // give the garage reading a moment, then the stint report
}

// ---------- polling the bridge ----------
async function poll(){
  try{
    const st = await (await fetch("/live/status",{cache:"no-store"})).json();
    ST.connected = st.connected;
    if (st.gen>0 && (st.gen!==ST.gen || st.siUpdate!==ST.si)){
      const r = await fetch("/live/meta",{cache:"no-store"});
      if (r.ok){ const g=+r.headers.get("X-Gen"); ST.meta=parseMeta(await r.arrayBuffer()); ST.si=+r.headers.get("X-Si");
        if (g!==ST.gen){ ST.secs=null; ST.loss=null; ST.bestOther={}; ST.det={}; ST.dc=null; ST.checking=null; ST.outLap=true; ST.corners=[]; ST.vert=[]; ST.zones=[]; ST.spin=[]; ST.exitSlides=[]; zone=null; ST.gen=g; ST.next=-120; ST.cur=newLap(); ST.prev=null; ST.lap=null; ST.recent=[]; ST.stint=null; corner=null; ST.ref=null; ST.best=Infinity; ST.lapT0=null; ST.log=[]; ST.coach=null; ST.refTrace=null; ST.refStored=false; ST.lapsClean=0; ST.Kstored=false; setBrand(); loadStoredRef(); loadStoredK(); } }
    }
    if (ST.meta && st.total>0){
      const r = await fetch("/live/data?max=600&from="+ST.next,{cache:"no-store"});
      if (+r.headers.get("X-Gen")===ST.gen){
        const b=await r.arrayBuffer(); ST.next=+r.headers.get("X-Next");
        const dv=new DataView(b), n=Math.floor(b.byteLength/ST.meta.bufLen);
        for (let k=0;k<n;k++){ const s=decode(dv,k*ST.meta.bufLen,ST.meta.vars); addSample(s); if (ST.secs && (ST.sampleN=(ST.sampleN||0)+1)%3===0) timeCars(dv,k*ST.meta.bufLen,s.SessionTime); }
      }
    }
  }catch(e){ ST.connected=false; }
  draw();
  setTimeout(poll, 100);
}
poll();
</script>
