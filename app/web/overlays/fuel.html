<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hanna</title>
<style>
:root{--ink:#eef0f4;--muted:#9aa3b2;--line:rgba(255,255,255,.09);--panel:rgba(14,16,21,.82);--accent:#ff6a4d;--ok:#5fd38d;--warn:#ffc06b;--bad:#ff5d5d;--blue:#8cc4f7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;height:100%}
body{font:12px/1.25 system-ui,"Segoe UI",sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;user-select:none}
#root{position:relative;width:100%;height:100%;padding:9px 11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;transition:opacity .25s;display:flex;flex-direction:column;gap:6px}
body.hidden #root{opacity:0}
body.edit #root{outline:2px dashed var(--accent);outline-offset:-2px;-webkit-app-region:drag;cursor:move}
#editbar{display:none;position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;color:#fff;background:var(--accent);border-radius:0 0 10px 10px;padding:2px}
body.edit #editbar{display:block}
.k{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top b{font-size:11px;letter-spacing:.1em;color:var(--accent)}
.hero{display:grid;grid-template-columns:1fr .8fr 1fr;gap:6px}
.hero b{font-size:19px !important}
.hero div{background:rgba(255,255,255,.05);border-radius:6px;padding:4px 7px}
.hero b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:3px}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff}
.rows{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;background:rgba(255,255,255,.05);border-radius:6px;padding:4px 7px;font-size:11.5px}
.rows b{font-weight:700;text-align:right}
.sub{font-size:9.5px;color:var(--muted);font-weight:400}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.blue{color:var(--blue)}
.box{font-size:12px;font-weight:800;text-align:center;border-radius:6px;padding:3px;background:var(--bad);color:#fff;display:none}
.box.on{display:block}
</style>
</head>
<body class="hidden">
<div id="root">
  <div class="top"><b>HANNA</b><span class="k" id="info">waiting for iRacing</span></div>
  <div class="hero">
    <div><span class="k">In the tank</span><b id="fuel">–</b></div>
    <div><span class="k">Laps of fuel</span><b id="laps">–</b></div>
    <div><span class="k">Time to empty</span><b id="ftime">–</b></div>
  </div>
  <div class="bar" title="tank, and where the flag is"><i id="tankbar"></i><u id="flagmark" style="display:none"></u></div>
  <div class="rows">
    <span class="k">Per lap</span><b id="burn">–</b>
    <span class="k">Race</span><b id="race">–</b>
    <span class="k">Pit stops</span><b id="stops">–</b>
    <span class="k">+1 lap target</span><b id="t1">–</b>
    <span class="k">Save a stop</span><b id="tstop">–</b>
    <span class="k">This lap</span><b id="now">–</b>
    <span class="k">Double stint</span><b id="dbl">–</b>
  </div>
  <div class="box" id="box">BOX THIS LAP</div>
  <div id="editbar">Hanna · fuel &amp; strategy · drag to move · drag the edge to resize</div>
</div>
<script>
"use strict";
const BASE_W = 320;
const $ = id => document.getElementById(id);
const fmt = (v,d=1) => Number.isFinite(v) ? v.toFixed(d) : "–";
const median = a => { if (!a.length) return NaN; const s=Float64Array.from(a).sort(); const m=s.length>>1; return s.length%2? s[m] : (s[m-1]+s[m])/2; };
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : NaN;
const lapTxt = t => Number.isFinite(t) ? `${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,"0")}` : "–";
// text size and font come from the app (Overlays panel); the window itself can be any size
let TEXT = 1;
function fit(){ document.body.style.zoom = TEXT; }
fit();
if (window.se && window.se.onStyle) window.se.onStyle(s => { TEXT = s.text || 1; document.body.style.fontFamily = `"${s.font||"Segoe UI"}", system-ui, sans-serif`; fit(); });
let edit=false;
if (window.se) window.se.onEditMode(on => { edit=on; document.body.classList.toggle("edit", on); });

// ---------- data ----------
const WANT = ["SessionTime","SessionTimeRemain","SessionLapsRemainEx","FuelLevel","Lap","LapDistPct","OnPitRoad","IsOnTrack","PlayerCarInPitStall","Speed"];
const TYPES = {0:"getUint8",1:"getUint8",2:"getInt32",3:"getUint32",4:"getFloat32",5:"getFloat64"};
const cstr = b => { let s=""; for (const x of b){ if(!x) break; s+=String.fromCharCode(x);} return s; };
function parseMeta(buf){
  const dv=new DataView(buf), i32=o=>dv.getInt32(o,true);
  const siLen=i32(16), siOff=i32(20), numVars=i32(24), varOff=i32(28), bufLen=i32(36), vars={};
  for (let i=0;i<numVars;i++){ const o=varOff+i*144; vars[cstr(new Uint8Array(buf,o+16,32))]={type:i32(o),off:i32(o+4),count:i32(o+8)}; }
  const y=cstr(new Uint8Array(buf,siOff,siLen)), num=re=>{ const m=y.match(re); return m? parseFloat(m[1]) : NaN; };
  const tank = num(/DriverCarFuelMaxLtr:\s*([\d.]+)/) * (num(/DriverCarMaxFuelPct:\s*([\d.]+)/) || 1);
  // tread remaining per tyre (lowest of outer/middle/inner) from the garage reading
  const tread={}; const cs=y.slice(y.indexOf("CarSetup:"));
  for (const [c,nm] of [["LF","LeftFront"],["RF","RightFront"],["LR","LeftRear"],["RR","RightRear"]]){ const m=cs.match(new RegExp(nm+":[\\s\\S]*?TreadRemaining:\\s*([^\\n]+)")); if (m){ const v=m[1].split(",").map(parseFloat).filter(x=>!isNaN(x)); if (v.length===3) tread[c]=Math.min(...v); } }
  const idx=(y.match(/DriverCarIdx:\s*(\d+)/)||[])[1]; let car="";
  if (idx!==undefined){ const m=y.match(new RegExp("\\n\\s*- CarIdx:\\s*"+idx+"\\s*\\n[\\s\\S]*?CarPath:\\s*(\\S+)")); if (m) car=m[1]; }
  const trackId = ((y.match(/TrackID:\s*(\d+)/)||[])[1]) || "";
  return {vars, bufLen, tank, tread, treadSig: JSON.stringify(tread), car, trackId};
}
function decode(dv,p,vars){ const s={}; for (const k of WANT){ const v=vars[k]; if (v && v.count===1) s[k]=dv[TYPES[v.type]](p+v.off,true); } return s; }

// ---------- fuel ledger: every clean lap measured at the line ----------
const ST = { stintLaps:0, treadBase:null, dbl:null, gen:null, si:null, next:-60, meta:null, last:null, lap:null, lapFuel:NaN, lapT0:NaN, lapClean:true, laps:[], connected:false };
function addSample(s){
  ST.last = s;
  if (s.OnPitRoad || !s.IsOnTrack) ST.lapClean = false;
  if (ST.lap!==null && s.Lap!==ST.lap){
    const used = ST.lapFuel - s.FuelLevel, t = s.SessionTime - ST.lapT0;
    if (ST.lapClean && used>0.2 && t>20) { ST.laps.push({used, t}); if (ST.laps.length>20) ST.laps.shift(); }
    setTimeout(lapCall, 2500);   // radio: once you're past the line
    if (ST.lapClean) ST.stintLaps++;
    ST.lapFuel = s.FuelLevel; ST.lapT0 = s.SessionTime; ST.lapClean = !s.OnPitRoad && !!s.IsOnTrack;
  }
  if (ST.lap===null){ ST.lapFuel = s.FuelLevel; ST.lapT0 = s.SessionTime; ST.lapClean = false; }   // joined mid-lap: don't count it
  ST.lap = s.Lap;
}

// ---------- the plan ----------
function plan(){
  const s=ST.last; if (!s) return null;
  const used = ST.laps.map(l=>l.used), times = ST.laps.map(l=>l.t), H=ST.learned;
  // cautious burn: the thirstier of your last 3 clean laps and your typical lap.
  // Until 3 laps are measured, Bono's memory of this car and track fills in (and it never plans on less than it remembers).
  let burn = used.length ? Math.max(mean(used.slice(-3)), median(used)) : NaN, fromMem=false;
  if (H && H.fuel>0 && used.length<3){ burn = Number.isFinite(burn) ? Math.max(burn, H.fuel) : H.fuel; fromMem = true; }
  const lapT = times.length ? median(times) : (H && H.lapMed>0 ? H.lapMed : NaN);
  const pct = Math.min(Math.max(s.LapDistPct,0),1), fuel = s.FuelLevel, tank = ST.meta.tank;
  // laps to go: lap-limited race, else timed (finish the lap the clock runs out on, plus the one you're on)
  let toGo = NaN, kind = "";
  if (s.SessionLapsRemainEx>0 && s.SessionLapsRemainEx<10000){ toGo = s.SessionLapsRemainEx - pct + 1; kind = "laps"; }
  else if (s.SessionTimeRemain>0 && s.SessionTimeRemain<1e6 && lapT>0){ const rest = (1-pct)*lapT; toGo = (1-pct) + Math.max(0, Math.ceil((s.SessionTimeRemain - rest)/lapT)); kind = "time"; }
  const inTank = fuel/burn;
  const need = toGo*burn + 0.5;                                // to the flag, plus a small reserve
  const short = need - fuel;
  const stops = !Number.isFinite(short) ? NaN : short<=0 ? 0 : (tank>0 ? Math.ceil(short/tank) : 1);
  const addNext = stops>0 ? Math.min(tank - 0, Math.ceil(stops===1 ? short + burn : tank)) : 0;   // last stop: just enough (+1 lap); otherwise full
  // targets
  const lapsAtLine = Math.floor(inTank + pct);                 // whole laps the current tank gives from the last line crossing
  const fuelAtLine = fuel + pct*burn;
  const plusOne = fuelAtLine / (lapsAtLine + 1);
  const saveStop = stops>0 ? (fuel + (stops-1)*tank) / toGo : NaN;
  // this lap: fuel used so far, projected to a full lap
  const usedNow = ST.lapFuel - fuel, proj = pct>0.15 && ST.lapClean ? usedNow/pct : NaN;
  // pit window: when a full tank from here reaches the flag
  const windowIn = stops===1 && tank>0 ? Math.max(0, toGo - (tank-0.5)/burn) : NaN;
  return {burn, lapT, fuel, tank, toGo, kind, inTank, need, stops, addNext, plusOne, saveStop, proj, windowIn, pct, n:used.length, last:used[used.length-1], fromMem};
}

// ---------- double stint: tread used over the last stint → tread left after a full first stint ----------
function treadUpdate(old){
  const T=ST.meta.tread; if (!T || Object.keys(T).length<4) return;
  if (!old || old.treadSig===ST.meta.treadSig) { if (!ST.treadBase) ST.treadBase=T; return; }
  const base=ST.treadBase||old.tread;
  if (base && ST.stintLaps>=3){
    const per={}; let ok=true; for (const c of Object.keys(T)){ const w=(base[c]-T[c])/ST.stintLaps; if (!(w>0)) ok=false; per[c]=w; }
    if (ok){ const burn=plan()?.burn, tankLaps = ST.meta.tank>0 && burn>0 ? Math.floor(ST.meta.tank/burn) : NaN;
      const left = Object.fromEntries(Object.entries(per).map(([c,w])=>[c, 100 - w*tankLaps]));
      const worst = Object.entries(left).reduce((a,b)=>b[1]<a[1]?b:a); ST.dbl={worst, tankLaps}; }
  }
  ST.treadBase=T; ST.stintLaps=0;
}
// ---------- team radio: Hanna's calls ----------
const say = (text, pri=1) => { if (window.se && window.se.radioSay) window.se.radioSay("hanna", text, pri); };
const R = { lap:0, mode:"", window:false, dbl:"", warn:0 };
const n1 = v => Number.isFinite(v) ? (Math.round(v*10)/10).toString() : "";
function lapCall(){
  const s=ST.last; if (!s || !ST.meta || !s.IsOnTrack || s.OnPitRoad) return;
  const P=plan(); if (!P || !Number.isFinite(P.burn)) return;
  R.lap++;
  // fuel status: when it changes, and a reminder every 5 laps
  let mode="", txt="";
  if (!Number.isFinite(P.stops)) return;
  if (P.stops===0){ mode="ok"; txt="Fuel is good to the end."; }
  else if (Number.isFinite(P.saveStop) && P.saveStop/P.burn>0.93){ mode="save"; txt=`We can save a stop. Fuel target ${n1(P.saveStop)} litres a lap, you're on ${n1(P.burn)}.`; }
  else { mode="stop"+P.stops; txt=`${P.stops===1?"One stop":P.stops+" stops"} to the end. ${n1(P.inTank)} laps of fuel in the car.`; }
  if (mode!==R.mode || R.lap%5===0){ say(txt, mode!==R.mode && mode!=="ok" ? 2 : 1); R.mode=mode; }
  // pit window opens
  if (P.stops===1 && Number.isFinite(P.windowIn) && P.windowIn<=0 && !R.window){ R.window=true; say(`Pit window is open. Add ${P.addNext>=P.tank-1?"a full tank":Math.round(P.addNext)+" litres"} when you stop.`, 2); }
  // getting low
  if (P.stops>0 && P.inTank<3 && P.inTank>=1.5 && R.warn!==2){ R.warn=2; say(`About ${Math.floor(P.inTank)} laps of fuel left.`, 2); }
}
let boxSaid=false;
function boxCall(on){ if (on && !boxSaid){ say("Box, box. Box this lap.", 3); } boxSaid=on; }
function dblCall(txt){ if (txt && txt!==R.dbl){ R.dbl=txt; say(txt, 1); } }
// ---------- display ----------
function draw(){
  const s=ST.last, inCar = s && s.IsOnTrack;
  document.body.classList.toggle("hidden", !(edit || ST.connected));   // whenever iRacing is connected, garage included
  if (!s || !ST.meta) return;
  const P=plan();
  $("info").textContent = `lap ${s.Lap}${P.fromMem?` · from memory (${ST.learned.n} stints)`:P.n<2?" · measuring":""}`;
  $("fuel").textContent = fmt(P.fuel,1)+" L";
  $("laps").textContent = Number.isFinite(P.inTank) ? fmt(P.inTank,1) : "–";
  $("laps").className = P.inTank<2 ? "bad" : P.inTank<4 ? "warn" : "";
  // time until the tank is empty at your average pace and burn
  const secs = P.inTank * P.lapT;
  $("ftime").textContent = Number.isFinite(secs) ? (secs>=3600 ? `${Math.floor(secs/3600)}:${String(Math.floor(secs%3600/60)).padStart(2,"0")}:${String(Math.floor(secs%60)).padStart(2,"0")}` : `${Math.floor(secs/60)}:${String(Math.floor(secs%60)).padStart(2,"0")}`) : "–";
  $("ftime").className = $("laps").className;
  const tk = P.tank>0 ? P.tank : NaN;
  $("tankbar").style.width = Number.isFinite(tk) ? Math.min(100,P.fuel/tk*100)+"%" : "0";
  $("tankbar").style.background = P.stops===0 ? "var(--ok)" : "var(--blue)";
  const fm = Number.isFinite(tk) && Number.isFinite(P.need) && P.need<=tk ? P.need/tk*100 : NaN;
  $("flagmark").style.display = Number.isFinite(fm) ? "" : "none"; if (Number.isFinite(fm)) $("flagmark").style.left = fm+"%";
  $("burn").innerHTML = Number.isFinite(P.burn) ? `${fmt(P.burn,2)} L <span class="sub">${P.n?`last ${fmt(P.last,2)} · `:"remembered · "}lap ${lapTxt(P.lapT)}</span>` : `<span class="sub">after your first clean lap</span>`;
  $("race").innerHTML = Number.isFinite(P.toGo) ? `${fmt(P.toGo,1)} laps to go <span class="sub">need ${fmt(P.need,1)} L</span>` : `<span class="sub">open session</span>`;
  $("stops").innerHTML = !Number.isFinite(P.stops) ? "–"
    : P.stops===0 ? `<span class="ok">None – fuel reaches the flag</span>`
    : `${P.stops} <span class="sub">next: add ${P.stops>1||P.addNext>=P.tank-1 ? "FULL" : "+"+fmt(P.addNext,0)+" L"}${Number.isFinite(P.windowIn)?` · ${P.windowIn<=0?"window open":"window in "+fmt(P.windowIn,0)+" laps"}`:""}</span>`;
  $("t1").innerHTML = Number.isFinite(P.plusOne) && Number.isFinite(P.burn) ? `${fmt(P.plusOne,2)} L/lap <span class="sub">save ${fmt(P.burn-P.plusOne,2)} per lap</span>` : "–";
  const reach = P.saveStop/P.burn;
  $("tstop").innerHTML = !Number.isFinite(P.saveStop) ? `<span class="sub">no stop to save</span>`
    : `<span class="${reach>0.93?"ok":reach>0.85?"warn":"bad"}">${fmt(P.saveStop,2)} L/lap</span> <span class="sub">${reach>0.93?"doable":reach>0.85?"hard":"not realistic"}</span>`;
  const target = Number.isFinite(P.saveStop) && reach>0.85 ? P.saveStop : P.plusOne;
  $("now").innerHTML = Number.isFinite(P.proj) ? `<span class="${P.proj<=target?"ok":"warn"}">${fmt(P.proj,2)} L</span> <span class="sub">${P.proj<=target?"on target":"over target by "+fmt(P.proj-target,2)}</span>` : `<span class="sub">–</span>`;
  // double stint: needs >= 70% tread after the first stint (more detail in the app's Tyres window)
  // before this session has measured a stint, use the tread wear Bono remembers for this car and track
  const H=ST.learned, wearMem = H ? Math.max(H.wearF||0, H.wearR||0) : 0, tankLapsMem = P.tank>0 && P.burn>0 ? Math.floor(P.tank/P.burn) : NaN;
  if (!ST.dbl && wearMem>0 && Number.isFinite(tankLapsMem)){ const left=100-wearMem*tankLapsMem, ax=(H.wearF||0)>=(H.wearR||0)?"fronts":"rears";
    $("dbl").innerHTML = left>=70 ? `<span class="ok">Likely</span> <span class="sub">${ax} ~${fmt(left,0)}% after ${tankLapsMem} laps (remembered)</span>`
      : `<span class="warn">Unlikely</span> <span class="sub">${ax} ~${fmt(Math.max(0,left),0)}% after ${tankLapsMem} laps (remembered, needs 70%)</span>`; }
  else $("dbl").innerHTML = !ST.dbl ? `<span class="sub">after a stint ends in the pits</span>`
    : ST.dbl.worst[1]>=70 ? `<span class="ok">Possible</span> <span class="sub">${ST.dbl.worst[0]} ${fmt(ST.dbl.worst[1],0)}% after ${ST.dbl.tankLaps} laps</span>`
    : `<span class="bad">Not advised</span> <span class="sub">${ST.dbl.worst[0]} ${fmt(Math.max(0,ST.dbl.worst[1]),0)}% after ${ST.dbl.tankLaps} laps (needs 70%)</span>`;
  // box: you won't make the next line crossing + one more lap
  const boxNow = Number.isFinite(P.inTank) && P.stops>0 && P.inTank < (1-P.pct) + 1;
  $("box").classList.toggle("on", boxNow); boxCall(boxNow && s.IsOnTrack && !s.OnPitRoad);
  if (ST.dbl) dblCall(ST.dbl.worst[1]>=70 ? `Tyres look good for a double stint, about ${Math.round(ST.dbl.worst[1])} percent left after the first.` : `Double stint isn't advised. The ${ST.dbl.worst[0]} would be down to ${Math.round(Math.max(0,ST.dbl.worst[1]))} percent.`);
}

async function poll(){
  try{
    const st = await (await fetch("/live/status",{cache:"no-store"})).json();
    ST.connected = st.connected;
    if (st.gen>0 && (st.gen!==ST.gen || st.siUpdate!==ST.si)){
      const r = await fetch("/live/meta",{cache:"no-store"});
      if (r.ok){ const g=+r.headers.get("X-Gen"); const old=ST.meta; ST.meta=parseMeta(await r.arrayBuffer()); ST.si=+r.headers.get("X-Si");
        treadUpdate(old);
        if (g!==ST.gen){ ST.gen=g; ST.next=-60; ST.lap=null; ST.laps=[]; ST.learned=null; Object.assign(R,{lap:0, mode:"", window:false, dbl:"", warn:0}); boxSaid=false;
          // Bono's memory: fuel per lap, lap time and tyre wear from your past stints here
          if (window.se && window.se.learnSummary && ST.meta.car) window.se.learnSummary(ST.meta.car, ST.meta.trackId).then(h=>{ if (g===ST.gen) ST.learned=h; }).catch(()=>{}); } }
    }
    if (ST.meta && st.total>0){
      const r = await fetch("/live/data?max=600&from="+ST.next,{cache:"no-store"});
      if (+r.headers.get("X-Gen")===ST.gen){
        const b=await r.arrayBuffer(); ST.next=+r.headers.get("X-Next");
        const dv=new DataView(b), n=Math.floor(b.byteLength/ST.meta.bufLen);
        for (let k=0;k<n;k++) addSample(decode(dv,k*ST.meta.bufLen,ST.meta.vars));
      }
    }
  }catch(e){ ST.connected=false; }
  draw();
  setTimeout(poll, 200);
}
poll();
</script>
</body>
</html>
