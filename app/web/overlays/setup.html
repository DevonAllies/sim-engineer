<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup</title>
<style>
:root{--ink:#eef0f4;--muted:#9aa3b2;--line:rgba(255,255,255,.09);--panel:rgba(14,16,21,.90);--accent:#ff6a4d;--ok:#5fd38d;--warn:#ffb347;--bad:#ff6a6a;--chip:rgba(255,255,255,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;height:100%}
body{font:12px/1.35 system-ui,"Segoe UI",sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;user-select:none}
#root{position:relative;width:100%;height:100%;padding:9px 11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:opacity .25s}
body.hidden #root{opacity:0}
body.edit #root{outline:2px dashed var(--accent);outline-offset:-2px;-webkit-app-region:drag;cursor:move}
#editbar{display:none;position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;color:#fff;background:var(--accent);border-radius:0 0 10px 10px;padding:2px}
body.edit #editbar{display:block}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top b{font-size:11px;letter-spacing:.1em;color:var(--accent)}
.k{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
/* status: one chip per area, coloured; the ones that need work spell out why */
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10.5px;padding:1px 7px;border-radius:10px;background:var(--chip);border:1px solid var(--line)}
.chip i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px;background:var(--muted)}
.chip.ok i{background:var(--ok)}.chip.warn i{background:var(--warn)}
.chip.ok,.chip.warn{color:var(--ink)}
.why{font-size:11px;color:var(--muted)}
.why b{color:var(--warn);font-weight:600}
/* the changes */
.hd{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:5px}
.card{border-left:3px solid var(--muted);padding:3px 0 3px 8px}
.card.p3{border-left-color:var(--bad)}.card.p2{border-left-color:var(--warn)}.card.p1{border-left-color:var(--ok)}
.card.alldone{opacity:.55}
.card h4{font-size:12.5px;font-weight:650;margin:0 0 2px}
.st{display:grid;grid-template-columns:14px 1fr;gap:4px;align-items:baseline;font-size:11.5px}
.st .ic{color:var(--muted);text-align:center}
.st.set .ic{color:var(--ok)}
.st.todo .ic{color:var(--warn)}
.st .w{color:var(--muted)}
.st .to{font-weight:650;white-space:nowrap}
.st.set .to{color:var(--ok)}
.feel{font-size:11px;color:var(--muted);margin-top:1px}
.feel b{color:var(--ink);font-weight:500}
.foot{font-size:10.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:4px;margin-top:auto}
.foot b{color:var(--ink);font-weight:500}
.none{color:var(--muted);text-align:center;padding:16px 6px}
.ready{color:var(--ok);font-weight:600;font-size:12px}
#body{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;overflow:hidden}
</style>
</head>
<body class="hidden">
<div id="root">
  <div class="top"><b>SETUP</b><span class="k" id="info"></span></div>
  <div id="body"></div>
  <div id="editbar">Setup · drag to move · drag the edge to resize</div>
</div>
<script>
"use strict";
// what to change before the next run, laid out for the driver: a status strip (balance, aero, tyres…), then each switched-on change with
// its garage clicks, ticked off as the live garage matches them, and what you should feel afterwards. Shows in the garage and pit stall.
const $=id=>document.getElementById(id);
let TEXT=1;
if (window.se && window.se.onStyle) window.se.onStyle(s=>{ TEXT=s.text||1; document.body.style.fontFamily=`"${s.font||"Segoe UI"}", system-ui, sans-serif`; draw(); });
let edit=false, plan=null, where={connected:false, inGarage:false};
if (window.se){ window.se.onEditMode(on=>{ edit=on; document.body.classList.toggle("edit",on); vis(); });
  window.se.onPlan(p=>{ plan=p; draw(); }); window.se.getPlan().then(p=>{ plan=p; draw(); }); }
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function vis(){ document.body.classList.toggle("hidden", !(edit || (where.connected && where.inGarage))); }
// the overlay can't scroll (it lets the mouse through to iRacing), so everything has to fit: first the "what it does" lines go,
// then the "Feel" lines, then the text shrinks (down to 75%), and if it still doesn't fit the changes are shown a page at a time
// (the pages turn every 8 s, "page 1 of 2" in the header)
const fits = () => { const b=$("body"); return b.scrollHeight<=b.clientHeight+1; };
let PAGE=0, PAGES=1, pageTimer=null;
function draw(){
  vis(); const B=plan && plan.brief;
  if (!B){ $("info").textContent=""; $("body").innerHTML=`<div class="none">Drive a stint: what to change shows here.</div>`; return; }
  $("info").textContent=[B.track, B.when].filter(Boolean).join(" · ");
  const C=B.changes||[];
  const put=(o)=>{ $("body").innerHTML=compose(B, o); document.body.style.zoom=o.z; };
  for (const lv of [{does:1,feel:1},{does:0,feel:1},{does:0,feel:0}]){ put({...lv, z:TEXT, from:0, to:C.length}); if (fits()){ PAGES=1; return; } }
  for (let z=TEXT*0.95; z>=TEXT*0.75-1e-9; z-=TEXT*0.05){ put({does:0, feel:0, z, from:0, to:C.length}); if (fits()){ PAGES=1; return; } }
  // pages: as many changes per page as fit at 75%
  const z=TEXT*0.75; let per=1; for (let k=C.length-1;k>=1;k--){ put({does:0, feel:0, z, from:0, to:k, page:"1 of 2"}); if (fits()){ per=k; break; } }
  PAGES=Math.ceil(C.length/per); if (PAGE>=PAGES) PAGE=0;
  put({does:0, feel:0, z, from:PAGE*per, to:Math.min(C.length,(PAGE+1)*per), page:`${PAGE+1} of ${PAGES}`});
  clearTimeout(pageTimer); pageTimer=setTimeout(()=>{ PAGE=(PAGE+1)%PAGES; draw(); }, 8000);
}
// "12 clicks" → "10 clicks": the change itself (−2), so it's clear how far to go
function delta(a, b){ const x=parseFloat(a), y=parseFloat(b); if (!Number.isFinite(x) || !Number.isFinite(y) || x===y) return "";
  const dec=Math.max((String(a).match(/\.(\d+)/)||["",""])[1].length, (String(b).match(/\.(\d+)/)||["",""])[1].length), d=y-x;
  return `${d>0?"+":"−"}${Math.abs(d).toFixed(dec)}`; }
function compose(B, o){
  const L=B.lines||[], C=B.changes||[];
  // status strip
  let h=`<div class="chips">${L.map(l=>`<span class="chip ${l.c||""}" title="${esc(l.v)}"><i></i>${esc(l.k)}</span>`).join("")}</div>`;
  const bad=L.filter(l=>l.c==="warn").slice(0,2);
  if (bad.length) h+=bad.map(l=>`<div class="why"><b>${esc(l.k)}:</b> ${esc(l.v)}</div>`).join("");
  // the changes
  const steps=C.flatMap(c=>c.steps), nSet=steps.filter(s=>s.set===true).length, live=!!B.live;
  const early=C.length && C.every(c=>c.early);
  h+=`<div class="hd"><span class="k">${early?"Suggested · early read":"Changes for the next run"}${C.length?` · ${C.length}`:""}${o.page?` · page ${o.page}`:""}</span><span class="k">${live&&steps.length?`${nSet} of ${steps.length} set`:""}</span></div>`;
  if (!C.length) h+=`<div class="why">${B.next?`No setup change suggested. Next step: ${esc(B.next)}`:"No setup change suggested: the car is where you like it."}</div>`;
  for (const c of C.slice(o.from, o.to)){ const done=live && c.steps.every(s=>s.set===true);
    h+=`<div class="card p${c.pr} ${done?"alldone":""}"><h4>${done?"✓ ":""}${esc(c.h)}</h4>`
      + c.steps.map(s=>{ const cls=s.set===true?"set":live&&s.set===false?"todo":"", ic=s.set===true?"✓":live&&s.set===false?"○":"•", d=delta(s.from, s.to);
          // the values go right after the setting's name and wrap with the text, so they can never be cut off at the edge
          return `<div class="st ${cls}"><span class="ic">${ic}</span><span><span class="w">${esc(s.tab)}${s.sect?` › ${esc(s.sect)}`:""} ·</span> ${esc(s.name)}${s.inCar?` <span class="w">(cockpit)</span>`:""}: <span class="to">${esc(s.from)} → ${esc(s.to)}</span>${d?` <span class="w">(${d})</span>`:""}</span></div>`; }).join("")
      + (o.does && c.does && !done ? `<div class="feel">${esc(c.does)}</div>` : "")
      + (o.feel && c.feel && !done ? `<div class="feel"><b>Feel:</b> ${esc(c.feel)}</div>` : "") + `</div>`; }
  if (live && steps.length && nSet===steps.length) h+=`<div class="ready">✓ All set. Save the setup, then run 5 clean laps.</div>`;
  if (plan.load || plan.saveAs) h+=`<div class="foot">${plan.load?`From <b>${esc(plan.load)}</b>`:""}${plan.saveAs?` · save as <b>${esc(plan.saveAs)}</b>`:""}</div>`;
  return h;
}
window.addEventListener("resize", ()=>draw());
// where is the car? (garage / pit stall = show, driving = hide)
const TYPES={0:"getUint8",1:"getUint8",2:"getInt32",3:"getUint32",4:"getFloat32",5:"getFloat64"};
const cstr=b=>{ let s=""; for (const x of b){ if(!x) break; s+=String.fromCharCode(x);} return s; };
let meta=null, gen=null;
async function poll(){
  try{
    const st=await (await fetch("/live/status",{cache:"no-store"})).json(); where.connected=st.connected;
    if (st.gen>0 && st.gen!==gen){ const r=await fetch("/live/meta",{cache:"no-store"}); if (r.ok){ const b=await r.arrayBuffer(), dv=new DataView(b), i32=o=>dv.getInt32(o,true), vars={};
      for (let i=0;i<i32(24);i++){ const o=i32(28)+i*144; vars[cstr(new Uint8Array(b,o+16,32))]={type:i32(o),off:i32(o+4)}; } meta={vars,bufLen:i32(36)}; gen=st.gen; } }
    if (meta && st.total>0){ const r=await fetch("/live/data?from=-1&max=1",{cache:"no-store"}); const b=await r.arrayBuffer();
      if (b.byteLength>=meta.bufLen){ const dv=new DataView(b), g=k=>{ const v=meta.vars[k]; return v? dv[TYPES[v.type]](v.off,true) : 0; };
        where.inGarage = !g("IsOnTrack") || !!g("PlayerCarInPitStall"); } }
  }catch(e){ where.connected=false; }
  vis(); setTimeout(poll, 500);
}
draw(); poll();
</script>
</body>
</html>
